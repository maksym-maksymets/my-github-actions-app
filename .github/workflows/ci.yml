name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Cache Node.js dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-24-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-24-

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t my-github-actions-app .

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      HEROKU_EMAIL: ${{ secrets.HEROKU_EMAIL }}
      HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
    steps:
      - name: Check Heroku configuration
        id: heroku
        run: |
          if [ -n "$HEROKU_API_KEY" ] && [ -n "$HEROKU_EMAIL" ] && [ -n "$HEROKU_APP_NAME" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Heroku deployment not performed: configure the three HEROKU secrets."
            echo "Heroku deployment NOT performed: account, app and secrets are not configured." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout repository
        if: steps.heroku.outputs.ready == 'true'
        uses: actions/checkout@v7

      - name: Install Heroku CLI
        if: steps.heroku.outputs.ready == 'true'
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Deploy to Heroku
        if: steps.heroku.outputs.ready == 'true'
        run: |
          echo "$HEROKU_API_KEY" | docker login --username="$HEROKU_EMAIL" --password-stdin registry.heroku.com
          docker build -t "registry.heroku.com/$HEROKU_APP_NAME/web" .
          docker push "registry.heroku.com/$HEROKU_APP_NAME/web"
          heroku container:release web --app "$HEROKU_APP_NAME"
